name: Quotidien Marges (Article Philo Quotidien)

on:
  workflow_dispatch: # Déclenchement manuel
  schedule:
    # Tous les jours à 06h00 UTC (7h ou 8h heure française)
    - cron: '0 6 * * *'

jobs:
  daily-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: 🤖 Création automatique d'un texte philosophique quotidien
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            # Sélection d'un thème aléatoire parmi les thèmes philo du site
            THEMES=("conscience" "langage" "ethique" "travail" "creativite" "relations" "pouvoir" "attention")
            FORMATS=("essai" "question" "dialogue" "note")
            RANDOM_THEME=${THEMES[$RANDOM % ${#THEMES[@]}]}
            RANDOM_FORMAT=${FORMATS[$RANDOM % ${#FORMATS[@]}]}
            echo "Génération quotidienne : Thème=$RANDOM_THEME, Format=$RANDOM_FORMAT"
            node scripts/generate-article.mjs "$RANDOM_THEME" "$RANDOM_FORMAT"
          else
            echo "GEMINI_API_KEY non fournie dans les Secrets GitHub."
          fi

      - name: Rebuild du site statique et index Pagefind
        run: |
          npm run build

      - name: Commit et Push vers la branche dev
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/textes/ public/cours-files/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): publication philosophique quotidienne et sync cours [skip ci]" && git push origin dev)
