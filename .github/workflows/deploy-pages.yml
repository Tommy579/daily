name: Déploiement GitHub Pages & Publication Quotidienne

on:
  push:
    branches: [dev, main]
  # Exécution quotidienne à 06h00 UTC (7h heure d'hiver / 8h heure d'été en France)
  schedule:
    - cron: '0 6 * * *'
  # Déclenchement manuel avec paramètres
  workflow_dispatch:
    inputs:
      generate_article:
        description: "Générer un nouvel article avec Gemini avant de déployer ?"
        required: true
        type: boolean
        default: true
      theme:
        description: "Thème de l'article (vide pour aléatoire : conscience, langage, ethique, travail, creativite, relations, pouvoir, attention)"
        required: false
        default: ""
      format:
        description: "Format de l'article (vide pour aléatoire : essai, question, dialogue, note)"
        required: false
        default: ""

# Évite les déploiements concurrents simultanés
concurrency:
  group: 'pages'
  cancel-in-progress: true

# Permissions requises pour écrire le nouveau fichier, le pousser et déployer sur GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate_and_build:
    name: Génération Gemini & Build Astro
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          # On se positionne sur la branche actuelle déclenchée (dev ou main)
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      # -------------------------------------------------------------
      # ÉTAPE : Appel API Gemini si cron quotidien ou déclenchement demandé
      # -------------------------------------------------------------
      - name: 🤖 Génération philosophique quotidienne avec Gemini
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_article == true)) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_THEME: ${{ inputs.theme }}
          INPUT_FORMAT: ${{ inputs.format }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ Erreur : Le secret GEMINI_API_KEY n'est pas configuré dans les secrets du dépôt."
            exit 1
          fi

          echo "Lancement de generate-article.mjs..."
          node scripts/generate-article.mjs "$INPUT_THEME" "$INPUT_FORMAT"

      # -------------------------------------------------------------
      # ÉTAPE : Commit et push du nouveau texte sur la branche active
      # -------------------------------------------------------------
      - name: 📝 Commit et Push du texte généré
        if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_article == true)) }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git status
          if [ -n "$(git status --porcelain src/content/textes/)" ]; then
            git add src/content/textes/
            git commit -m "chore(auto): texte philosophique quotidien (Gemini) [skip ci]"
            # On pousse sur la branche courante
            git push origin HEAD:${{ github.ref_name }}
            echo "✓ Nouveau texte commité et poussé avec succès."
          else
            echo "Aucun nouveau fichier texte à commiter."
          fi

      # -------------------------------------------------------------
      # ÉTAPE : Build du site statique Astro et indexation Pagefind
      # -------------------------------------------------------------
      - name: 🏗️ Build du site Astro & index Pagefind
        run: npm run build

      - name: ⚙️ Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Téléversement de l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Déploiement sur GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: generate_and_build
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Déploiement vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
